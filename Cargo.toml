[package]
name = "llama_rs"
version = "0.1.0"
edition = "2021"
description = "llama.rs — Llama in Rust: Rust-native inference API, backend by llama.cpp (staged disk→RAM, GSV live, pure Rust)"
license = "MIT"
readme = "README.md"
repository = "https://github.com/platinoff/llama-rs"
authors = ["platinoff"]
keywords = ["llama", "llm", "inference", "gguf", "rust"]
categories = ["science", "machine-learning"]
exclude = ["models/*.gguf", "target/*", ".llvm/*", ".cmake/*", "llama.cpp-master/*"]

[features]
default = []
embeddings = []
metrics = []

[lib]
name = "llama_rs"
path = "src/lib.rs"

[[bin]]
name = "llama_rs"
path = "src/main.rs"

[[bin]]
name = "llama_speed"
path = "src/bin/llama_speed.rs"
required-features = ["metrics"]

[dependencies]
clap = { version = "4.6", features = ["derive"] }
encoding_rs = "0.8"
# Pinned to 0.1.154 on purpose: the local registry copies carry 4 build.rs
# patches (aarch/discovery, cpp-httplib static link, llama-common-base, import
# libs) + 1 MTP common/log.cpp edit. Bumping to 0.1.156 requires re-applying
# all five + the 27B GGUF E2E (docs/HANDOFF_NEW_SESSION.md).
llama-cpp-2 = { version = "=0.1.154", features = ["sampler"] }
sysinfo = "0.39"
thiserror = "2.0"

[dev-dependencies]
criterion = "0.5"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true

[[bench]]
name = "speed"
harness = false

[workspace]
members = ["xtask"]
