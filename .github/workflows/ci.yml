name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM/Clang (for bindgen)
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "18"

      - name: Set LIBCLANG_PATH (Windows)
        run: |
          $paths = @(
            "C:\Program Files (x86)\Microsoft Visual Studio\2022\Enterprise\VC\Tools\Llvm\x64\bin",
            "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\VC\Tools\Llvm\x64\bin",
            "C:\Program Files\LLVM\bin"
          )
          foreach ($p in $paths) {
            if (Test-Path "$p\libclang.dll") {
              echo "LIBCLANG_PATH=$p" >> $env:GITHUB_ENV
              exit 0
            }
          }
          $clang = (Get-Command clang -ErrorAction SilentlyContinue).Path
          if ($clang) {
            $dir = (Split-Path $clang)
            echo "LIBCLANG_PATH=$dir" >> $env:GITHUB_ENV
          }

      - name: Set up Rust (GNU)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-gnu
          targets: x86_64-pc-windows-gnu

      - name: Install CMake 3.31
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "3.31.9"

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-gnu-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-gnu-cargo-

      - name: Check (xtask)
        run: cargo xtask check
        env:
          LIBCLANG_PATH: ${{ env.LIBCLANG_PATH }}
          CMAKE: ${{ env.CMAKE }}

      - name: Loc audit (ratio ≥96%)
        run: cargo xtask loc

      - name: Build release
        run: cargo build --release
        env:
          LIBCLANG_PATH: ${{ env.LIBCLANG_PATH }}

      - name: Run release binary
        run: .\target\release\llama_rs.exe --help
